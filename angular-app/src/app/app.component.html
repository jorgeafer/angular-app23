@if (showLogout()) {
  <header class="app-header">
    <div class="app-header__logo">MiCartera</div>
    <div class="app-header__actions">
      @if (showPasskeySetup()) {
        <button
          type="button"
          class="app-button-secondary passkey-setup-btn"
          (click)="setupPasskey()"
          [disabled]="isRegisteringPasskey()"
          title="Configurar Face ID para acceso biométrico"
        >
          @if (isRegisteringPasskey()) {
            <svg class="spin" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
              <path d="M12 2a10 10 0 1 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          }
          <span class="desktop-only">{{ isRegisteringPasskey() ? 'Configurando...' : 'Activar Face ID' }}</span>
        </button>
      }
      <button
        type="button"
        class="app-button-secondary"
        (click)="refreshPrices()"
        [disabled]="isRefreshingPrices()"
        title="Actualiza los precios de todas las posiciones con datos de mercado en tiempo real"
      >
        @if (isRefreshingPrices()) {
          <svg class="spin" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path d="M12 2a10 10 0 1 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="desktop-only">Actualizando...</span>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path d="M1 4v6h6M23 20v-6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="desktop-only">Actualizar</span>
        }
      </button>
      <button type="button" class="app-button-secondary" (click)="logout()">
        <span class="desktop-only">{{ username() ? username() + ' · ' : '' }}</span>Cerrar sesión
      </button>
    </div>
  </header>

}

<router-outlet />
