@if (showLogout()) {
  <!-- Desktop header -->
  <header class="app-header desktop-only">
    <div class="app-header__logo">MiCartera</div>
    <div class="app-header__actions">
      <button
        type="button"
        class="app-button-secondary"
        (click)="refreshPrices()"
        [disabled]="isRefreshingPrices()"
        title="Actualiza los precios de todas las posiciones con datos de mercado en tiempo real"
      >
        @if (isRefreshingPrices()) {
          <svg class="spin" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path d="M12 2a10 10 0 1 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Actualizando...
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path d="M1 4v6h6M23 20v-6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Actualizar
        }
      </button>
      <button type="button" class="app-button-secondary" (click)="logout()">
        {{ username() ? username() + ' · ' : '' }}Cerrar sesión
      </button>
    </div>
  </header>

  <!-- Mobile bottom navigation -->
  <nav class="bottom-nav mobile-only">
    <a class="bottom-nav__item" [routerLink]="''" [queryParams]="{tab: 'posiciones'}" routerLinkActive="bottom-nav__item--active" [routerLinkActiveOptions]="{exact: false}">
      <svg viewBox="0 0 24 24">
        <path d="M9 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4m0-18v18m0-18h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-10" />
      </svg>
      <span>Posiciones</span>
    </a>
    <a class="bottom-nav__item" [routerLink]="''" [queryParams]="{tab: 'resumen'}" routerLinkActive="bottom-nav__item--active" [routerLinkActiveOptions]="{exact: false}">
      <svg viewBox="0 0 24 24">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
      <span>Resumen</span>
    </a>
    <button type="button" class="bottom-nav__item" [class.bottom-nav__item--refreshing]="isRefreshingPrices()" (click)="refreshPrices()" [disabled]="isRefreshingPrices()">
      @if (isRefreshingPrices()) {
        <svg class="spin" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1 4v6h6M23 20v-6h-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
      <span>Actualizar</span>
    </button>
    <button type="button" class="bottom-nav__item bottom-nav__item--cta" (click)="openQuickAdd()">
      <svg viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>Añadir</span>
    </button>
  </nav>
}

<router-outlet />
