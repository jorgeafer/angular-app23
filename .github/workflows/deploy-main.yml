name: Deploy Main To AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: GIT_BRANCH,APP_DIR
          script: |
            set -e

            if [ -z "$APP_DIR" ]; then
              echo "EC2_APP_DIR is not set"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout "$GIT_BRANCH"
            git pull --ff-only origin "$GIT_BRANCH"

            cd angular-app
            npm ci
            npm run build

            if pm2 describe angular-app23-api >/dev/null 2>&1; then
              pm2 restart angular-app23-api
            else
              pm2 start "node backend/server.js" --name angular-app23-api
            fi

            pm2 save
            sudo systemctl reload nginx
